<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Gradient definitions for depth -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B5FD9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B4CB8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B7FE9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B5FD9;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#1a365d" flood-opacity="0.3"/>
    </filter>
    
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="120" cy="120" r="110" fill="url(#primaryGradient)" opacity="0.08" class="bg-pulse"/>
  
  <!-- Horse head - Enhanced design -->
  <g fill="none" stroke="url(#primaryGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropShadow)">
    
    <!-- Horse ear (left) -->
    <path d="M95 45 C100 35, 110 35, 115 45 C115 50, 110 55, 105 55 C100 55, 95 50, 95 45" class="draw-animation" style="animation-delay: 0.2s"/>
    
    <!-- Horse mane/forehead -->
    <path d="M80 50 C70 40, 65 45, 70 60 C75 75, 85 85, 95 90" class="draw-animation" style="animation-delay: 0.4s"/>
    <path d="M130 50 C140 40, 145 45, 140 60 C135 75, 125 85, 115 90" class="draw-animation" style="animation-delay: 0.6s"/>
    
    <!-- Main horse head outline -->
    <path d="M95 45 C85 35, 75 40, 70 55 C65 70, 70 90, 85 105 C90 110, 95 115, 105 120" class="draw-animation" style="animation-delay: 0.8s"/>
    <path d="M115 45 C125 35, 135 40, 140 55 C145 70, 140 90, 125 105 C120 110, 115 115, 105 120" class="draw-animation" style="animation-delay: 1s"/>
    
    <!-- Horse nose/muzzle -->
    <path d="M105 120 C100 130, 105 135, 120 135 C135 135, 140 130, 135 120" class="draw-animation" style="animation-delay: 1.2s"/>
    
    <!-- Nostril details -->
    <ellipse cx="115" cy="130" rx="3" ry="2" fill="url(#primaryGradient)" class="fade-in" style="animation-delay: 1.4s"/>
    <ellipse cx="125" cy="130" rx="3" ry="2" fill="url(#primaryGradient)" class="fade-in" style="animation-delay: 1.5s"/>
    
    <!-- Inner ear detail -->
    <path d="M100 50 C105 45, 110 45, 110 50" stroke-width="2" class="draw-animation" style="animation-delay: 1.6s"/>
  </g>
  
  <!-- Scales of Justice - Enhanced -->
  <g stroke="url(#primaryGradient)" fill="none" filter="url(#dropShadow)">
    
    <!-- Central post with detail -->
    <line x1="120" y1="150" x2="120" y2="190" stroke-width="6" stroke-linecap="round" class="draw-animation" style="animation-delay: 1.8s"/>
    <circle cx="120" cy="155" r="4" fill="url(#lightGradient)" class="scale-in" style="animation-delay: 2s"/>
    
    <!-- Base platform with depth -->
    <ellipse cx="120" cy="190" rx="35" ry="8" fill="url(#primaryGradient)" opacity="0.3" class="scale-in" style="animation-delay: 2.2s"/>
    <line x1="85" y1="190" x2="155" y2="190" stroke-width="8" stroke-linecap="round" class="draw-animation" style="animation-delay: 2.2s"/>
    
    <!-- Cross beam -->
    <line x1="85" y1="160" x2="155" y2="160" stroke-width="4" stroke-linecap="round" class="draw-animation" style="animation-delay: 2.4s"/>
    
    <!-- Left scale pan with chains -->
    <g class="scale-bounce" style="animation-delay: 2.6s; transform-origin: 95px 160px;">
      <!-- Chain links -->
      <line x1="90" y1="160" x2="90" y2="170" stroke-width="2"/>
      <line x1="100" y1="160" x2="100" y2="170" stroke-width="2"/>
      
      <!-- Scale pan -->
      <ellipse cx="95" cy="175" rx="15" ry="4" fill="url(#lightGradient)" stroke-width="3"/>
      <path d="M80 175 C80 175, 95 180, 110 175" stroke-width="2"/>
    </g>
    
    <!-- Right scale pan with chains -->
    <g class="scale-bounce" style="animation-delay: 2.8s; transform-origin: 145px 160px;">
      <!-- Chain links -->
      <line x1="140" y1="160" x2="140" y2="170" stroke-width="2"/>
      <line x1="150" y1="160" x2="150" y2="170" stroke-width="2"/>
      
      <!-- Scale pan -->
      <ellipse cx="145" cy="175" rx="15" ry="4" fill="url(#lightGradient)" stroke-width="3"/>
      <path d="M130 175 C130 175, 145 180, 160 175" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.6">
    <!-- Small stars around the logo -->
    <g fill="url(#lightGradient)" class="twinkle">
      <circle cx="60" cy="80" r="2"/>
      <circle cx="180" cy="70" r="1.5"/>
      <circle cx="70" cy="160" r="1"/>
      <circle cx="170" cy="180" r="2"/>
    </g>
  </g>
  
  <!-- Loading ring -->
  <circle cx="120" cy="120" r="115" fill="none" stroke="url(#primaryGradient)" stroke-width="2" opacity="0.3" 
          stroke-dasharray="30 15" class="loading-rotate"/>
  
  <!-- Advanced animations -->
  <style>
    /* Drawing animation for paths */
    .draw-animation {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: draw 1.5s ease-in-out forwards;
    }
    
    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    
    /* Fade in animation */
    .fade-in {
      opacity: 0;
      animation: fadeIn 0.8s ease-in-out forwards;
    }
    
    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
    
    /* Scale in animation */
    .scale-in {
      transform: scale(0);
      animation: scaleIn 0.6s ease-back forwards;
    }
    
    @keyframes scaleIn {
      to {
        transform: scale(1);
      }
    }
    
    /* Bounce animation for scales */
    .scale-bounce {
      animation: scaleBounce 3s ease-in-out infinite;
    }
    
    @keyframes scaleBounce {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-2px) rotate(1deg); }
      75% { transform: translateY(-1px) rotate(-1deg); }
    }
    
    /* Background pulse */
    .bg-pulse {
      animation: bgPulse 4s ease-in-out infinite;
    }
    
    @keyframes bgPulse {
      0%, 100% { opacity: 0.05; }
      50% { opacity: 0.15; }
    }
    
    /* Rotating loading indicator */
    .loading-rotate {
      transform-origin: 120px 120px;
      animation: rotate 4s linear infinite;
    }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* Twinkling stars */
    .twinkle {
      animation: twinkle 2s ease-in-out infinite alternate;
    }
    
    @keyframes twinkle {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }
    
    /* Hover effects (for interactive use) */
    svg:hover .scale-bounce {
      animation-duration: 1s;
    }
    
    svg:hover .loading-rotate {
      animation-duration: 1s;
    }
  </style>
</svg>